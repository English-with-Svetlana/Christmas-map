<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Christmas Map · Mrs Claus’s directions</title><link rel="stylesheet" href="style.css"><link rel="preload" as="image" href="assets/room.webp"></head><body><main id="stage" aria-label="Christmas directions quest">
